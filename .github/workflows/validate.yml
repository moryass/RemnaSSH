name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        run: bash -n install.sh lib/*.sh templates/*.sh.tpl tests/*.sh

      - name: Run ShellCheck
        run: shellcheck -x install.sh templates/*.sh.tpl tests/*.sh

      - name: Validate JSON templates
        run: |
          jq -e . templates/full-profile.json.tpl >/dev/null
          jq -e . templates/happ-balancer.json >/dev/null
          for site in templates/site-*.html.tpl; do
            grep -qi '<!doctype html>' "$site"
            grep -q '__DOMAIN__' "$site"
            grep -q '<style>' "$site"
          done

      - name: Test panel payload generation
        run: |
          REMNASSH_INSTALL_DIR=/tmp/remnassh-panel-test bash -c '
            source lib/common.sh
            source lib/panel.sh
            PANEL_PROFILE_UUID=11111111-1111-4111-8111-111111111111
            PANEL_NODE_UUID=22222222-2222-4222-8222-222222222222
            NODE_DOMAIN=node.example.com
            test "$(profile_tag_suffix "$NODE_DOMAIN")" = 0B3ADEAA
            test "$(profile_inbound_tag VLESS_XHTTP_CADDY)" = VLESS_XHTTP_CADDY_0B3ADEAA
            test "$(panel_profile_name)" = "RemnaSSH node-0B3ADEAA"
            body=$(panel_host_body \
              33333333-3333-4333-8333-333333333333 \
              p3-xhttp-node 443 /api/test h2 true "" REMNASSH:22222222 node.example.com TLS)
            jq -e '\''
              .remark == "p3-xhttp-node" and
              .path == "/api/test" and
              .fingerprint == "firefox" and
              .securityLayer == "TLS" and
              .excludeFromSubscriptionTypes == [] and
              .isHidden == true and
              .nodes[0] == "22222222-2222-4222-8222-222222222222" and
              .inbound.configProfileUuid == "11111111-1111-4111-8111-111111111111"
            '\'' <<<"$body" >/dev/null
          '

      - name: Test panel synchronization
        run: |
          python3 tests/mock_panel.py &
          mock_pid=$!
          trap 'kill "$mock_pid" 2>/dev/null || true' EXIT
          for _ in {1..20}; do
            curl -fsS http://127.0.0.1:18080/state >/dev/null && break
            sleep 0.2
          done
          sudo bash tests/panel_sync.sh

      - name: Validate Compose template
        run: |
          work="$(mktemp -d)"
          sed \
            -e 's|__CADDY_IMAGE__|caddy:2.11.4-alpine|g' \
            -e 's|__REMNANODE_IMAGE__|remnawave/node:3.4.3|g' \
            templates/docker-compose.yml.tpl > "$work/docker-compose.yml"
          printf '%s\n' \
            'NODE_DOMAIN=node.example.com' \
            'ACME_EMAIL=admin@example.com' \
            'CADDY_INTERNAL_PORT=8443' \
            'XHTTP_PATH=/api/v3/test/video_stream.mp4' \
            'GRPC_SERVICE_NAME=grpc_test' > "$work/.env"
          printf '%s\n' 'NODE_PORT=2222' 'SECRET_KEY=test' > "$work/node.env"
          touch "$work/Caddyfile"
          mkdir -p "$work/www" "$work/caddy-data" "$work/caddy-config"
          docker compose -f "$work/docker-compose.yml" config --quiet

      - name: Validate Caddy configurations
        run: |
          env_file="$(mktemp)"
          printf '%s\n' \
            'NODE_DOMAIN=node.example.com' \
            'ACME_EMAIL=admin@example.com' \
            'CADDY_INTERNAL_PORT=8443' \
            'XHTTP_PATH=/api/v3/test/video_stream.mp4' \
            'GRPC_SERVICE_NAME=grpc_test' > "$env_file"
          for config in templates/Caddyfile.tpl templates/Caddyfile.bootstrap.tpl; do
            docker run --rm --entrypoint caddy --env-file "$env_file" \
              -v "$PWD/$config:/etc/caddy/Caddyfile:ro" \
              caddy:2.11.4-alpine validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done

      - name: Validate profile with Xray
        run: |
          work="$(mktemp -d)"
          image='remnawave/node:3.4.3'
          key_output="$(docker run --rm --entrypoint /usr/local/bin/xray "$image" x25519)"
          private_key="$(awk -F': ' '/PrivateKey/ {print $2; exit}' <<<"$key_output")"
          test -n "$private_key"
          cert_dir="$work/data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/node.example.com"
          mkdir -p "$cert_dir"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=node.example.com' \
            -keyout "$cert_dir/node.example.com.key" \
            -out "$cert_dir/node.example.com.crt" >/dev/null 2>&1
          sed \
            -e 's|__DOMAIN__|node.example.com|g' \
            -e 's|__NODE_TAG__|0B3ADEAA|g' \
            -e 's|__CADDY_INTERNAL_PORT__|8443|g' \
            -e 's|__XHTTP_PATH__|/api/v3/test/video_stream.mp4|g' \
            -e 's|__XHTTP_MODE__|stream-one|g' \
            -e 's|__GRPC_SERVICE_NAME__|grpc_test|g' \
            -e "s|__REALITY_PRIVATE_KEY__|$private_key|g" \
            -e 's|__REALITY_SHORT_ID__|0123456789abcdef|g' \
            templates/full-profile.json.tpl > "$work/profile.json"
          docker run --rm --entrypoint /usr/local/bin/xray \
            -v "$work/profile.json:/etc/xray/config.json:ro" \
            -v "$work/data:/data:ro" \
            "$image" run -test -config /etc/xray/config.json

      - name: Test installed command symlink
        run: |
          ln -s "$PWD/install.sh" /tmp/remnassh
          /tmp/remnassh help | grep -q 'sudo bash install.sh restore'
          /tmp/remnassh help | grep -q 'sudo bash install.sh probe'

      - name: Test interactive menu
        run: |
          work="$(mktemp -d)"
          output="$(printf '0\n' | sudo env REMNASSH_INSTALL_DIR="$work/empty" ./install.sh menu)"
          grep -q 'Установить Remnawave Node' <<<"$output"
          mkdir -p "$work/installed"
          printf 'NODE_DOMAIN=node.example.com\n' > "$work/installed/state.env"
          touch "$work/installed/docker-compose.yml"
          output="$(printf '0\n' | sudo env REMNASSH_INSTALL_DIR="$work/installed" ./install.sh menu)"
          grep -q 'Обновить RemnaSSH, Node и конфигурацию' <<<"$output"

      - name: Test decoy site selection
        run: |
          work="$(mktemp -d)"
          mkdir -p "$work/node"
          printf '%s\n' \
            'NODE_DOMAIN=node.example.com' \
            'ACME_EMAIL=admin@example.com' \
            'PANEL_IP=192.0.2.10' \
            'NODE_PORT=2222' \
            'CADDY_INTERNAL_PORT=8443' \
            'XHTTP_MODE=stream-one' \
            'XHTTP_PATH=/api/test' \
            'GRPC_SERVICE_NAME=grpc_test' \
            'ALT_TCP_PORTS=8443,2053' \
            'ALT_UDP_PORTS=8443' \
            'SITE_TEMPLATE=site-studio.html.tpl' \
            'REALITY_PRIVATE_KEY=test-private' \
            'REALITY_PUBLIC_KEY=test-public' \
            'REALITY_SHORT_ID=0123456789abcdef' > "$work/node/state.env"
          if ! output="$(sudo env REMNASSH_INSTALL_DIR="$work/node" bash "$PWD/install.sh" site site-docs.html.tpl 2>&1)"; then
            printf '::error title=Site command failed::%s\n' "${output//$'\n'/%0A}"
            exit 1
          fi
          test -f "$work/node/www/index.html" || { echo '::error::Rendered index.html is missing'; exit 1; }
          grep -q '<title>Helio Documentation</title>' "$work/node/www/index.html"
          grep -q 'node.example.com' "$work/node/www/index.html"
          test -s "$work/node/www/favicon.svg"
          sudo grep -q 'SITE_TEMPLATE=site-docs.html.tpl' "$work/node/state.env"

      - name: Test standalone bootstrap
        run: |
          stage="$(mktemp -d)"
          mkdir -p "$stage/RemnaSSH-main"
          cp -a . "$stage/RemnaSSH-main/"
          tar -czf "$stage/remnassh.tar.gz" -C "$stage" RemnaSSH-main
          cp install.sh "$stage/standalone-install.sh"
          REMNASSH_ARCHIVE_URL="file://$stage/remnassh.tar.gz" \
            bash "$stage/standalone-install.sh" help | grep -q 'RemnaSSH'
